services:
  server1:
    image: nginx:alpine
    container_name: server1
    volumes:
      - ./server1/html:/usr/share/nginx/html:ro

  server2:
    image: nginx:alpine
    container_name: server2
    volumes:
      - ./server2/html:/usr/share/nginx/html:ro

  lb:
    image: nginx:alpine
    container_name: lb
    ports:
      - "8080:80"
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
